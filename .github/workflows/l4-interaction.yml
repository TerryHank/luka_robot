name: L4 Interaction

on:
  push:
    branches:
      - feat/l4-voice-runtime-xiaozhi-skainet
      - refactor/workspace-layout
  pull_request:
    paths:
      - "src/system/nav_llm_agent/**"
      - "src/src/system/xiaozhi/**"
      - "src/src/system/bringup/**"
      - "src/src/system/scripts/start_xiaozhi*"
      - "src/visualization/console/nx_voice_gateway.py"
      - "src/visualization/console/nx_tts_pipeline.py"
      - "src/testing/evaluator/suite/test_l4_*"
      - "docs/architecture/L4_*"

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luka_ws/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pure-Python test dependencies
        run: python -m pip install --upgrade pytest numpy pyyaml
      - name: Compile L4 Python
        run: |
          python -m compileall -q src/system/nav_llm_agent/nav_llm_agent/interaction
          python -m compileall -q src/system/xiaozhi
      - name: Check shell syntax
        run: |
          bash -n src/system/bringup/start_nx_agent.sh
          bash -n src/system/bringup/start_nx_voice.sh
          bash -n src/system/bringup/audio_frontend_env.sh
          bash -n src/system/bringup/stop_audio_frontend.sh
          bash -n src/system/scripts/start_xiaozhi_mcp.sh
          bash -n src/system/scripts/start_xiaozhi_platform.sh
          bash -n src/system/scripts/l4_interaction_preflight.sh
      - name: Run L4 contract tests
        env:
          PYTHONPATH: src/system/nav_llm_agent
        run: |
          pytest -q \
            src/system/nav_llm_agent/test/test_voice_runtime.py \
            src/system/nav_llm_agent/test/test_interaction_gateway.py \
            src/testing/evaluator/suite/test_l4_interaction_voice_runtime.py \
            src/testing/evaluator/suite/test_l4_platform_architecture.py
