name: L4 Interaction

on:
  push:
    branches:
      - feat/l4-voice-runtime-xiaozhi-skainet
  pull_request:
    paths:
      - "system/nav_llm_agent/**"
      - "system/xiaozhi/**"
      - "system/bringup/**"
      - "system/scripts/start_xiaozhi*"
      - "visualization/console/nx_voice_gateway.py"
      - "visualization/console/nx_tts_pipeline.py"
      - "evaluator/suite/test_l4_*"
      - "docs/architecture/L4_*"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pure-Python test dependencies
        run: python -m pip install --upgrade pytest numpy pyyaml
      - name: Compile L4 Python
        run: |
          python -m compileall -q system/nav_llm_agent/nav_llm_agent/interaction
          python -m compileall -q system/xiaozhi
      - name: Check shell syntax
        run: |
          bash -n system/bringup/start_nx_agent.sh
          bash -n system/bringup/start_nx_voice.sh
          bash -n system/bringup/audio_frontend_env.sh
          bash -n system/bringup/stop_audio_frontend.sh
          bash -n system/scripts/start_xiaozhi_mcp.sh
          bash -n system/scripts/start_xiaozhi_platform.sh
      - name: Run L4 contract tests
        env:
          PYTHONPATH: system/nav_llm_agent
        run: |
          pytest -q             system/nav_llm_agent/test/test_voice_runtime.py             system/nav_llm_agent/test/test_interaction_gateway.py             evaluator/suite/test_l4_interaction_voice_runtime.py             evaluator/suite/test_l4_platform_architecture.py
