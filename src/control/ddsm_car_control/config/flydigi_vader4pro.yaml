joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 60.0
    sticky_buttons: false
    coalesce_interval_ms: 10

gamepad_teleop:
  ros__parameters:
    joy_topic: /joy
    cmd_vel_topic: /cmd_vel
    enabled_topic: /gamepad/enabled

    # Typical Linux XInput mapping. Verify these on the real controller.
    axis_forward: 1
    axis_lateral: 0
    axis_yaw: 3
    enable_button: 4
    turbo_button: 5
    require_enable_button: true

    # A negative scale reverses only that command direction.
    scale_forward: 0.9
    scale_lateral: 0.6
    scale_yaw: 2.4
    turbo_scale_forward: 1.35
    turbo_scale_lateral: 0.9
    turbo_scale_yaw: 3.6

    deadzone: 0.10
    axis_exponent: 1.50
    publish_rate: 60.0
    joy_timeout: 0.20
    stop_publish_duration: 0.30
