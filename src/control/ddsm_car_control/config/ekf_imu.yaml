ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.3
    two_d_mode: true
    transform_time_offset: 0.05
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false
    debug_out_file: /tmp/robot_localization_ekf_debug.txt
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: true
    odom0_config:
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - false
      - false
      - false
      - false
      - false
      - false
      - false

    imu0: /imu/data
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    imu0_config:
      - false
      - false
      - false
      - false
      - false
      - true
      - false
      - false
      - false
      - false
      - false
      - true
      - false
      - false
      - false

    use_control: false
