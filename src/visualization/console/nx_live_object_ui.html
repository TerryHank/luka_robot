<div id="nxLiveObject" style="margin:0 0 18px;padding:16px;border:1px solid #386c58;border-radius:12px;background:#10251d;color:#e8f5ee">
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
    <strong style="font-size:20px">YOLOE‑26n 实时物体检索</strong>
    <span id="nxLiveObjectBackend" style="color:#a6d8bd;font-size:13px">正在连接模型…</span>
  </div>
  <p style="margin:8px 0 14px;color:#c1d8c9">使用左目完整原始画幅逐块识别，不裁掉视角、不缩小原图；不会录像，也不会控制小车行驶。绿色框为已确认的候选。</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <label for="nxLiveObjectQuery">寻找</label>
    <input id="nxLiveObjectQuery" type="text" value="椅子" maxlength="100" list="nxLiveObjectHints" placeholder="例如：杯子、冰箱、剪刀；全部=识别词表内所有物体" style="min-width:230px;flex:1;max-width:440px;padding:9px;color:#10251d;background:#fff;border:1px solid #89b39b;border-radius:7px">
    <datalist id="nxLiveObjectHints"><option value="椅子"><option value="杯子"><option value="冰箱"><option value="瓶子"><option value="剪刀"><option value="门"><option value="全部"></datalist>
    <button id="nxLiveObjectStart" type="button" style="padding:10px 16px;background:#3c9b69;color:#fff;border:0;border-radius:7px">开始实时检索</button>
    <button id="nxLiveObjectStop" type="button" disabled style="padding:10px 16px;background:#684943;color:#fff;border:0;border-radius:7px">停止</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px" aria-label="常用物体">
    <button type="button" data-live-query="杯子">杯子</button><button type="button" data-live-query="瓶子">瓶子</button><button type="button" data-live-query="冰箱">冰箱</button><button type="button" data-live-query="剪刀">剪刀</button><button type="button" data-live-query="椅子">椅子</button><button type="button" data-live-query="全部">全部物体</button>
  </div>
  <p id="nxLiveObjectStatus" role="status" style="min-height:22px;color:#d6e7db">实时检索未启动。</p>
  <p><a id="nxLiveObjectOriginal" href="/api/live-object/frame.jpg" target="_blank" rel="noopener" style="color:#b5edd1">查看原始分辨率画面 ↗</a> <span id="nxLiveObjectResolution" style="color:#a6d8bd"></span></p>
  <div style="position:relative;width:100%;background:#07140f;border-radius:10px;overflow:hidden;min-height:180px">
    <div id="nxLiveObjectPlaceholder" style="padding:70px 16px;text-align:center;color:#9fb9aa">开始检索后显示实时标注画面</div>
    <img id="nxLiveObjectFrame" alt="YOLOE‑26n 实时检索画面" style="display:none;width:100%;height:auto;object-fit:contain">
  </div>
  <div id="nxLiveObjectHits" style="margin-top:10px;color:#caefd6"></div>
</div>
<script>
(()=>{
 const root=document.getElementById('nxLiveObject'),query=root.querySelector('#nxLiveObjectQuery'),status=root.querySelector('#nxLiveObjectStatus');
 const start=root.querySelector('#nxLiveObjectStart'),stop=root.querySelector('#nxLiveObjectStop'),frame=root.querySelector('#nxLiveObjectFrame'),placeholder=root.querySelector('#nxLiveObjectPlaceholder'),hits=root.querySelector('#nxLiveObjectHits'),backend=root.querySelector('#nxLiveObjectBackend'),resolution=root.querySelector('#nxLiveObjectResolution');
 let seen=-1,requestBusy=false;
 root.querySelectorAll('[data-live-query]').forEach(button=>button.onclick=()=>{query.value=button.dataset.liveQuery;});
 async function command(action){
   const button=action==='start'?start:stop;button.disabled=true;
   try{
     const response=await fetch('/api/live-object/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query.value.trim()})});
     const data=await response.json();
     if(!response.ok)throw Error(data.error||'操作失败');
     if(action==='stop'){status.textContent='已停止实时检索；小车未移动。';}
     await refresh();
   }catch(error){status.textContent=error.message;button.disabled=false;}
 }
 start.onclick=()=>command('start');stop.onclick=()=>command('stop');
 query.onkeydown=event=>{if(event.key==='Enter'&&!start.disabled)command('start');};
 async function refresh(){
   if(requestBusy)return;requestBusy=true;
   try{
     const response=await fetch('/api/live-object/status',{cache:'no-store'}),data=await response.json();
     if(!response.ok)throw Error(data.error||'服务未就绪');
     backend.textContent=data.backend+' · '+data.vocabulary_size+' 类';
     resolution.textContent=data.image_size?`${data.image_size[0]}×${data.image_size[1]} 原图 · ${data.tiles} 块原像素推理`:'等待相机原图';
     start.disabled=data.running;stop.disabled=!data.running;
     if(data.error){status.textContent=(data.running?'检索暂时中断：':'检索已停止：')+data.error;}
     else if(data.running&&data.frames===0){status.textContent='正在读取相机和首帧…';}
     else if(data.running){
       const age=data.completed_at?((Date.now()/1000)-data.completed_at):0;
       status.textContent=age>3?'相机画面已过期，请检查视觉服务':`正在检索「${data.query}」 · 第 ${data.frames} 帧 · 推理 ${data.inference_seconds?.toFixed(2)??'?'} 秒 · ${data.detections.length} 个候选`;
     }else if(!data.error){status.textContent='实时检索未启动。';}
     if(data.running&&data.frames!==seen&&data.frames>0){seen=data.frames;frame.src='/api/live-object/frame.jpg?frame='+data.frames;frame.style.display='block';placeholder.style.display='none';}
     if(!data.running){seen=-1;frame.style.display='none';frame.removeAttribute('src');placeholder.style.display='block';}
     hits.replaceChildren();
     for(const item of data.detections){const badge=document.createElement('span');badge.style.cssText='display:inline-block;margin:3px;padding:5px 9px;background:#1d4933;border-radius:6px';badge.textContent=item.label+' · '+Math.round(item.confidence*100)+'%';hits.append(badge);}
   }catch(error){backend.textContent='YOLOE‑26n 服务未连接';status.textContent=error.message;start.disabled=false;stop.disabled=true;}
   finally{requestBusy=false;}
 }
 refresh();setInterval(refresh,850);
})();
</script>
