/rtabmap_rgbd/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      allow_unknown: false
      max_planning_time: 0.7
      smooth_path: true
/rtabmap_rgbd/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: rtabmap_rgbd_map
    robot_base_frame: camera_link
    transform_tolerance: 0.3
    resolution: 0.05
    track_unknown_space: true
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /rtabmap_rgbd/map
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 4.5
      inflation_radius: 0.34
    footprint: '[[0.28,0.19],[0.28,-0.19],[-0.28,-0.19],[-0.28,0.19]]'
    footprint_padding: 0.03
