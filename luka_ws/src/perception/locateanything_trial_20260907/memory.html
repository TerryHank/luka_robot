<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小车物体观察记忆</title>
<style>body{font:17px/1.65 system-ui;max-width:1000px;margin:24px auto;padding:0 16px;background:#f4f6f8;color:#17212b}button,input{font:inherit;padding:8px;margin:4px}article{background:white;padding:16px;margin:16px 0;border-radius:10px}img{max-width:100%;width:640px}pre{white-space:pre-wrap;font:inherit}</style>
<a href="http://192.168.3.251:8503/">小车地图</a> · <a href="/view">相机与录像</a>
<h1>物体观察记忆</h1><p>第一阶段：停稳后识别并保存。这里不会驱动车轮。候选框需看图确认；当前使用手工测量外参，地图位置是待验证估计；不是精密定位。</p>
<input id="query" placeholder="例如：柜子、杯子、手机" maxlength="100"><button id="observe">观察并记住</button><button id="search">查询历史</button><button id="all">全部记录</button>
<p id="status">可先查看实时画面，确认物体在视野中。</p><img src="/snapshot.jpg" id="preview" alt="相机当前画面"><main id="results"></main>
<script>
const q=document.getElementById('query'),statusEl=document.getElementById('status'),results=document.getElementById('results');
function render(rows){results.replaceChildren();for(const r of rows){const a=document.createElement('article');const title=document.createElement('h3');title.textContent=r.query+' · '+new Date(r.captured_at*1000).toLocaleString();a.append(title);const img=document.createElement('img');img.src=r.image_url;img.alt='保存的识别候选图';a.append(img);const p=document.createElement('pre');const observer=r.context.map_from_base;p.textContent=(r.detections.length?'候选数：'+r.detections.length:'本次未检出目标')+'\n'+(observer?'拍摄时的小车观察点（不是物体位置）：'+observer.translation.map(x=>x.toFixed(2)).join(', ')+' 米':'本次小车地图位姿不可用')+'\n'+r.detections.map((d,i)=>(i+1)+'. '+d.label+'\n相机坐标（右、下、前）：'+(d.camera_xyz_m?d.camera_xyz_m.join(', ')+' 米':'深度无效')+'\n物体地图坐标：'+(d.map_xyz_m?d.map_xyz_m.map(x=>x.toFixed(2)).join(', ')+' 米（手工外参估计，待确认）':d.map_status==='camera_extrinsic_unverified'?'相机安装位姿尚未标定':'不可用')).join('\n');a.append(p);results.append(a);}}
async function search(all=false){try{const r=await fetch('/memory/search?query='+encodeURIComponent(all?'':q.value.trim()));const d=await r.json();render(d.observations);statusEl.textContent='历史记录 '+d.observations.length+' 条（最多显示最近 50 条）';}catch(e){statusEl.textContent='查询失败：'+e.message;}}
document.getElementById('search').onclick=()=>search();document.getElementById('all').onclick=()=>search(true);
document.getElementById('observe').onclick=async()=>{try{const r=await fetch('/memory/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error);statusEl.textContent='正在识别并保存，请稍候…';polling=true;}catch(e){statusEl.textContent=e.message;}};
let polling=false;setInterval(async()=>{if(!polling)return;try{const d=await(await fetch('/memory/status')).json();if(!d.busy){polling=false;statusEl.textContent=d.error||'观察已保存';if(d.result)render([d.result]);}}catch(e){statusEl.textContent='连接中断，请查询历史确认结果';polling=false;}},1500);
search(true);
</script></html>
