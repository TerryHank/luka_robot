<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>露卡 · 实时物体记忆</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px/1.7 system-ui;max-width:1200px;margin:30px auto;padding:0 22px;background:#101923;color:#e4eee8}a{color:#a8dfbd}h1{font-weight:600;letter-spacing:2px;margin:22px 0 6px}.muted{color:#a7b8b0}section,article{background:#192830;border:1px solid #30453f;border-radius:16px;padding:20px;margin:18px 0}button,input{font:inherit;border:1px solid #587166;border-radius:9px;padding:10px 14px;margin:4px;background:#203a30;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{background:#11221b;min-width:240px}.stop{background:#62342e}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{margin:0}article img{width:100%;border-radius:10px}h3{margin:4px 0}#preview{width:100%;max-width:640px;border-radius:12px}pre{white-space:pre-wrap;font:inherit}.actions{display:flex;flex-wrap:wrap;align-items:center}.id{font:12px monospace;color:#8ea49a}
</style>
<nav><a href="http://192.168.3.251:8503/">小车监控与巡航路线</a> · <a href="/view">相机与历史录像</a> · <a href="/memory/legacy">旧观察记录</a></nav>
<h1>实时物体记忆</h1><p class="muted">边观察，边记住。重复看到的物体会尝试关联到同一条记录，查询保留最近一次观察时间。</p>
<section><div class="actions"><button id="start">开始原地观察</button><button id="stop" class="stop">停止观察</button><span id="running">正在读取状态…</span></div>
<p class="muted">这里的按钮只开启识别，不驱动车轮。巡航请到小车监控页面启动。移动时保存观察点；停稳且深度有效时保存物体表面估计坐标。</p><p id="actionMessage" role="status"></p><p id="status"></p><p id="budget" class="muted"></p><img id="preview" alt="本次实时观察画面" hidden></section>
<section><div class="actions"><input id="query" placeholder="例如：杯子、蓝色杯子、椅子" maxlength="100"><button id="search">查询物体</button><button id="all">全部物体</button></div><p id="summary" class="muted"></p></section>
<main id="cards"></main><p class="muted">颜色来自图像区域估计，可能受背景和光照影响。多帧确认不等于类别绝对正确；相同外观物品移动后仍可能难以区分。没有查到不代表不存在。</p>
<script>
const $=id=>document.getElementById(id);let running=false,lastFrame=null,query='';
const reasons={camera_stale:'相机数据过期',localization_unavailable:'等待有效定位',odometry_stale:'里程计数据过期',turning_too_fast:'转向中，暂缓入库',moving_too_fast:'速度较快，暂缓入库',memory_budget:'8GB目标内存余量不足，已暂停处理',vision_busy:'视觉服务忙',blurred_frame:'画面模糊，暂缓入库',waiting_for_camera:'等待新画面',frame_error:'处理失败，正在重试'};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d;}
async function refresh(){try{const s=await api('/semantic/status');running=s.running;$('start').disabled=running;$('stop').disabled=!running;$('running').textContent=running?'观察中':'已停止';$('status').textContent=(s.error?s.error+'；':'')+(reasons[s.paused_reason]||s.paused_reason||'')+' · 已处理 '+s.frames+' 帧 · 本帧 '+(s.last_detections??0)+' 个候选';$('budget').textContent=s.memory?'整机占用估算 '+s.memory.system_used_gib+' GiB · 8GB目标余量 '+s.memory.target_headroom_gib+' GiB · 16GB开发板预算参考，仍需8GB实机验证':'';if(s.last_frame_at&&s.last_frame_at!==lastFrame){lastFrame=s.last_frame_at;$('preview').src='/semantic/frame.jpg?t='+lastFrame;$('preview').hidden=false;}}catch(e){$('status').textContent=e.message;}}
async function search(){try{const d=await api('/semantic/search?query='+encodeURIComponent(query));$('cards').replaceChildren();$('summary').textContent='找到 '+d.objects.length+' 个多帧确认的物体；不同楼层和地图分别保存。';for(const o of d.objects){const a=document.createElement('article'),h=document.createElement('h3'),id=document.createElement('p'),p=document.createElement('pre');h.textContent=o.description||o.name_zh||o.label;id.className='id';id.textContent=o.id+' · '+o.floor_id;const point=o.map_xyz_m,obs=o.observation_pose?.translation;p.textContent='最近看到：'+new Date(o.last_seen*1000).toLocaleString()+'\n'+(o.area_hint?'观察区域：'+o.area_hint+'\n':'')+(point?'物体表面估计位置：'+point.map(x=>x.toFixed(2)).join(', ')+' 米（手量外参，待验证）':obs?'小车当时的观察点：'+obs.map(x=>x.toFixed(2)).join(', ')+' 米；物体坐标未确认':'位置未确认')+'\n累计观察 '+o.seen_count+' 次'+(o.identity_uncertain?'\n外观相似，物体身份存在歧义':'');a.append(h,id);if(/^\/semantic\/file\/[a-zA-Z0-9_-]+\.jpg$/.test(o.evidence_url||'')){const im=document.createElement('img');im.src=o.evidence_url+'?t='+o.last_seen;im.alt='最近保存的识别证据画面';im.loading='lazy';a.append(im);}a.append(p);$('cards').append(a);}if(!d.objects.length)$('cards').textContent='尚未找到匹配记录。请先观察或巡航；未确认、遮挡和不支持的描述不会作为已找到返回。';}catch(e){$('summary').textContent=e.message;}}
$('start').onclick=async()=>{try{await api('/semantic/start',{});$('actionMessage').textContent='已开始观察';await refresh();}catch(e){$('actionMessage').textContent=e.message;}};$('stop').onclick=async()=>{try{const s=await api('/semantic/stop',{});$('actionMessage').textContent=s.ok?'已停止观察，已有记录保留':'正在收尾，请稍候';await refresh();await search();}catch(e){$('actionMessage').textContent=e.message;}};$('search').onclick=()=>{query=$('query').value.trim();search();};$('all').onclick=()=>{query='';$('query').value='';search();};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click();};refresh();search();setInterval(refresh,2000);setInterval(()=>{if(running)search();},10000);
</script></html>
